[project]
name = "climazoide-api"
version = "0.6.2"
description = "API de integração climática do projeto Climazoide"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Climazoide contributors" }]
requires-python = ">=3.11"
keywords = ["climate", "open-data", "south-america", "fastapi", "worcap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
science = [
  "joblib>=1.4,<2",
  "netCDF4>=1.7,<2",
  "numpy>=2,<3",
  "scikit-learn>=1.7,<2",
  "xarray>=2025.1,<2027",
  "xgboost>=3,<4",
]

[project.urls]
Homepage = "https://github.com/SouBeatrizKaroline/Climazoide-Backend"
Documentation = "https://github.com/SouBeatrizKaroline/Climazoide-Backend#readme"
Issues = "https://github.com/SouBeatrizKaroline/Climazoide-Backend/issues"
Source = "https://github.com/SouBeatrizKaroline/Climazoide-Backend"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
